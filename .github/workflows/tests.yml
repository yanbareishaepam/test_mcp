name: Playwright Java Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B -q -Dexec.classpathScope=test exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: mvn -B test

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report || true

      - name: Upload Allure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn

      - name: Check SendGrid email config
        if: always()
        run: |
          if [ -n "${{ secrets.SENDGRID_API_KEY }}" ] && [ -n "${{ secrets.MAIL_FROM }}" ] && [ -n "${{ secrets.MAIL_TO }}" ]; then
            echo "EMAIL_READY=true" >> "$GITHUB_ENV"
          else
            echo "EMAIL_READY=false" >> "$GITHUB_ENV"
            echo "SendGrid secrets are missing; email notification will be skipped."
          fi

      - name: Send email via SendGrid
        if: always() && env.EMAIL_READY == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.sendgrid.net
          server_port: 587
          username: apikey
          password: ${{ secrets.SENDGRID_API_KEY }}
          subject: "[${{ github.repository }}] Playwright report - ${{ job.status }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          reply_to: ${{ secrets.MAIL_REPLY_TO }}
          body: |
            Playwright test run finished.
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Status: ${{ job.status }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html_body: |
            <h3>Playwright report</h3>
            <p><b>Status:</b> ${{ job.status }}</p>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open GitHub Actions run</a></p>

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
