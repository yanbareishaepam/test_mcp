name: Playwright Java Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Playwright browsers
        run: mvn -B -q -Dexec.classpathScope=test exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install"

      - name: Run tests
        run: mvn -B test

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Zip Allure report
        if: always()
        run: zip -r allure-report.zip target/site/allure-maven-plugin

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report.zip
          if-no-files-found: error

      - name: Send email with report
        if: ${{ always() && secrets.SMTP_HOST != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Playwright test report - ${{ github.repository }} (${{ github.ref_name }})"
          to: yan_bareisha@epam.com
          from: GitHub Actions
          attachments: allure-report.zip
          secure: true
          body: |
            <p>Playwright smoke test run has finished.</p>
            <p>Repository: ${{ github.repository }}</p>
            <p>Branch: ${{ github.ref_name }}</p>
            <p>Status: ${{ job.status }}</p>
            <p>Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
